[project]
name = "telegram-downloader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "telethon>=1.38",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
