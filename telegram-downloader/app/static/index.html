<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>telegram-downloader</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
  input, select, button { padding: .4rem .6rem; margin: .2rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #ccc; padding: .4rem; text-align: left; font-size: .9rem; }
  .bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: #2a7; }
  #status { font-weight: bold; }
</style>
</head>
<body>
<h1>telegram-downloader</h1>

<section>
  <h2>1. Clé API</h2>
  <input id="apikey" type="password" size="60" placeholder="X-Api-Key (TELEGRAM_SIDECAR_API_KEY)">
  <button onclick="saveKey()">OK</button>
  <span id="status">non connecté</span>
</section>

<section>
  <h2>2. Serveur</h2>
  <button onclick="loadDialogs()">Lister les serveurs</button>
  <select id="dialogs"></select>
</section>

<section>
  <h2>3. Recherche</h2>
  <input id="q" type="text" size="40" placeholder="ex: dune">
  <input id="limit" type="number" value="20" min="1" max="200" style="width:4rem">
  <button onclick="search()">Chercher</button>
  <select id="cat"><option>ebooks</option><option>audiobooks</option><option selected>manga</option></select>
  <table id="results"></table>
</section>

<section>
  <h2>4. File de téléchargement (1 à la fois)</h2>
  <button onclick="loadJobs()">Rafraîchir</button>
  <label><input type="checkbox" id="auto" checked> auto-refresh</label>
  <table id="jobs"></table>
</section>

<script>
const $ = id => document.getElementById(id);
let KEY = localStorage.getItem('tg_key') || '';
$('apikey').value = KEY;

function saveKey() {
  KEY = $('apikey').value.trim();
  localStorage.setItem('tg_key', KEY);
  authStatus();
}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'X-Api-Key': KEY, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function authStatus() {
  try { const s = await api('/auth/status'); $('status').textContent = s.authorized ? 'connecté ✔ (uid ' + s.user_id + ')' : 'clé OK mais Telegram non loggé'; }
  catch (e) { $('status').textContent = 'erreur clé/API'; }
}
async function loadDialogs() {
  const d = await api('/dialogs');
  $('dialogs').innerHTML = d.map(x => `<option value="${x.id}">[${x.kind}] ${x.title}</option>`).join('');
}
async function search() {
  const id = $('dialogs').value;
  if (!id) return alert('choisis un serveur');
  const r = await api(`/dialogs/${id}/search?q=${encodeURIComponent($('q').value)}&limit=${$('limit').value}`);
  $('results').innerHTML = '<tr><th>message</th><th>fichier</th><th>taille</th><th></th></tr>' + r.map(m =>
    `<tr><td>${m.message_id}<br><small>${(m.text_snippet || '').slice(0, 80)}</small></td><td>${m.filename || '?'}</td><td>${m.size_bytes ? (m.size_bytes / 1048576).toFixed(1) + ' Mo' : '?'}</td><td><button onclick="enqueue(${id},${m.message_id})">Télécharger</button></td></tr>`).join('');
}
async function enqueue(dialog_id, message_id) {
  await api('/downloads', { method: 'POST', body: JSON.stringify({ dialog_id, message_id, category: $('cat').value }) });
  loadJobs();
}
async function loadJobs() {
  const j = await api('/downloads');
  $('jobs').innerHTML = '<tr><th>job</th><th>cat</th><th>statut</th><th>progression</th><th>fichier</th><th></th></tr>' + j.map(x =>
    `<tr><td>${x.id.slice(0, 8)}</td><td>${x.category}</td><td>${x.status}${x.error ? '<br><small>' + x.error + '</small>' : ''}</td><td><div class="bar"><div style="width:${(x.progress * 100).toFixed(0)}%"></div></div>${(x.progress * 100).toFixed(0)}%</td><td><small>${x.filename || ('message #' + x.message_id)}${x.size_bytes ? ' · ' + (x.size_bytes / 1048576).toFixed(1) + ' Mo' : ''}</small></td><td>${['queued', 'downloading'].includes(x.status) ? `<button onclick="cancelJob('${x.id}')">Annuler</button>` : ''}</td></tr>`).join('');
}
async function cancelJob(id) { await api('/downloads/' + id, { method: 'DELETE' }); loadJobs(); }
setInterval(() => { if ($('auto').checked && KEY) loadJobs(); }, 3000);
if (KEY) authStatus();
</script>
</body>
</html>
