services:
  librarr:
    build: .
    container_name: librarr
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - librarr-data:/data
      - /data/media/books/ebooks:/books/ebooks
      - /data/media/books/audiobooks:/books/audiobooks
      - /data/media/books/manga:/books/manga
    env_file:
      - .env
    environment:
      - LIBRARR_PORT=5050
      - LIBRARR_DB_PATH=/data/librarr.db
      # Permissions on imported files. Librarr creates files/dirs permissively
      # (0666/0777) and lets the umask narrow them, so companion services
      # (Kavita, Komga, Calibre) can read and write what it imports.
      # 002 = group-writable; 000 = defer entirely to the storage ACL.
      - UMASK=002
      - WISHLIST_CLEANUP_ENABLED=false
      - WISHLIST_CLEANUP_INTERVAL_HOURS=12
      - WISHLIST_CLEANUP_DRY_RUN=true
      # Set to true only when a trusted reverse proxy injects Authentik headers.
      - OIDC_PROXY_HEADERS_ENABLED=false

  telegram-downloader:
    build: ./telegram-downloader
    container_name: telegram-downloader
    restart: unless-stopped
    ports:
      - "5051:5051"
    volumes:
      - telegram-data:/data/telegram
      # Staging : les downloads atterrissent ici puis sont déplacés vers
      # /books/* via l'interface. Même parent que /books/* => rename atomique.
      - /data/media/books/.telegram-incoming:/downloads
      - /data/media/books/ebooks:/books/ebooks
      - /data/media/books/audiobooks:/books/audiobooks
      - /data/media/books/manga:/books/manga
    env_file:
      - .env
    environment:
      - TELEGRAM_SESSION_PATH=/data/telegram/session
      - TELEGRAM_DB_PATH=/data/telegram/queue.db
      - DOWNLOAD_DIR=/downloads
      - EBOOK_DIR=/books/ebooks
      - AUDIOBOOK_DIR=/books/audiobooks
      - MANGA_DIR=/books/manga

volumes:
  librarr-data:
  telegram-data:
